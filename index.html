    <script>
      (function () {
        var saved = localStorage.getItem('rectifier-lab-theme')
        var mode = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = mode
      })()
    </script>
